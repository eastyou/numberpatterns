<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数列规律练习</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 24px;
    background: #eef2f7;
    color: #1f2937;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Noto Sans CJK SC", sans-serif;
    line-height: 1.6;
}
.sheet {
    max-width: 820px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 14px;
    padding: 32px 36px 40px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
}
h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: 1px; }
.meta { margin: 0 0 24px; color: #64748b; font-size: 14px; }
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
@page { size: A4; margin: 14mm; }
@media print {
    body { background: #ffffff; padding: 0; }
    .sheet { box-shadow: none; border-radius: 0; max-width: none; padding: 0; }
    .answers { break-before: page; page-break-before: always; }
    .question, .rule-card { break-inside: avoid; page-break-inside: avoid; }
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}
.question {
    display: flex;
    gap: 12px;
    border: 1px solid #dbe3ee;
    border-radius: 10px;
    padding: 14px 16px;
    background: #f8fafc;
}
.q-no {
    flex: 0 0 30px;
    height: 30px;
    border-radius: 50%;
    background: #2563eb;
    color: #ffffff;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.q-body { flex: 1 1 auto; }
.q-terms { font-size: 19px; font-weight: 600; letter-spacing: 0.5px; }
.blank {
    display: inline-block;
    min-width: 44px;
    border-bottom: 2px solid #2563eb;
    text-align: center;
    color: #2563eb;
}
.q-line { margin-top: 10px; height: 1px; background: #cbd5e1; }
.answers { margin-top: 36px; }
.answers h2 { font-size: 20px; border-left: 4px solid #2563eb; padding-left: 10px; }
.answers ol { padding-left: 20px; }
.answers li { margin: 10px 0; }
.ans-value {
    display: inline-block;
    min-width: 54px;
    font-weight: 700;
    color: #b91c1c;
    font-family: "SFMono-Regular", Consolas, monospace;
}
.ans-rule { color: #2563eb; margin-right: 8px; }
.ans-detail { color: #64748b; font-size: 14px; }
@media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
}
@media print {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<main class="sheet">
<h1>数列规律练习</h1>
<p class="meta">难度：困难 &middot; 共 10 题 &middot; 姓名：________ &nbsp; 日期：________</p>
<div class="grid">
<section class="question"><div class="q-no">1</div><div class="q-body"><div class="q-terms mono">6, 9, 15, 24, 39, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">2</div><div class="q-body"><div class="q-terms mono">8, 12, 17, 23, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">3</div><div class="q-body"><div class="q-terms mono">9, 11, 11, 13, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">4</div><div class="q-body"><div class="q-terms mono">-2, -6, -18, -54, -162, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">5</div><div class="q-body"><div class="q-terms mono">4, 6, 10, 16, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">6</div><div class="q-body"><div class="q-terms mono">1, 1, 1, 1, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">7</div><div class="q-body"><div class="q-terms mono">1, -2, 4, -8, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">8</div><div class="q-body"><div class="q-terms mono">-3, 2, 10, 21, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">9</div><div class="q-body"><div class="q-terms mono">1, 4, 9, 16, <span class="blank">?</span></div><div class="q-line"></div></div></section>
<section class="question"><div class="q-no">10</div><div class="q-body"><div class="q-terms mono">-2, -2, -2, -2, <span class="blank">?</span></div><div class="q-line"></div></div></section>
</div>

</main>
</body>
</html>
