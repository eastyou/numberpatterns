[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numberpatterns"
version = "0.1.0"
description = "数列规律：识别递增规律、预测下一项与可打印练习页"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "math", "sequence", "patterns", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
numberpatterns = "numberpatterns.cli:main"

[tool.setuptools]
packages = ["numberpatterns"]
